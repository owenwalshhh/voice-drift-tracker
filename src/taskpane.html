<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Drift Tracker</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Voice Drift</h1>
      <p class="sub">How your voice shifts across the document</p>
    </div>
    <button id="refresh" class="btn primary" type="button">Read document</button>
  </header>

  <main>
    <section class="card">
      <div class="card-title">Measure</div>
      <div id="metrics" class="segmented" role="group" aria-label="Metric"></div>
      <p id="metric-hint" class="hint"></p>
    </section>

    <section class="card">
      <div class="card-title">Drift across the document</div>
      <div id="chart"></div>
      <div class="legend">
        <span><i class="sw line"></i>Rewrite</span>
        <span id="legend-orig" hidden><i class="sw dashed"></i>Original</span>
        <span><i class="sw band"></i>Target band</span>
      </div>
    </section>

    <section class="card">
      <div class="card-title">Paragraphs <span class="muted">click to jump</span></div>
      <div id="strip" class="strip"></div>
      <div class="key">
        <span><i class="cell-key in"></i>In band</span>
        <span><i class="cell-key near"></i>Near</span>
        <span><i class="cell-key out"></i>Drifted</span>
      </div>
      <p id="summary" class="summary"></p>
    </section>

    <details class="card">
      <summary>Target and original</summary>
      <label class="field">
        <span>Target style sample</span>
        <textarea id="target" rows="5" placeholder="Paste a passage in the style you are aiming for."></textarea>
      </label>
      <label class="field">
        <span>Original draft (optional)</span>
        <textarea id="orig" rows="4" placeholder="Paste the draft from before the rewrite to overlay it."></textarea>
      </label>
    </details>
  </main>

  <footer id="status" class="status" role="status"></footer>

  <script src="metrics.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
